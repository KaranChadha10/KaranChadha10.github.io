<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinner Ka Bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Gloock&family=Sacramento&display=swap">
<style>
/* Layout: one paper receipt on a blush ground; the bill turns into a love note at the bottom */
:root{
  --ground:#f6d6dc;
  --ground-deep:#eab6c1;
  --paper:#fffaf6;
  --ink:#4a1426;
  --wine:#a3123f;
  --faint:#b88a96;
  --f-display:"Gloock", Georgia, serif;
  --f-script:"Sacramento", "Brush Script MT", cursive;
  --f-mono:"Courier Prime", "Courier New", monospace;
  color-scheme: light;
}
html,body{min-height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background: radial-gradient(120% 80% at 50% 0%, var(--ground) 0%, var(--ground-deep) 100%) fixed, var(--ground);
  color:var(--ink);
  font-family:var(--f-mono);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:40px 56px;
  overflow-x:hidden;
}
canvas#hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:28px;align-items:center}
.receipt{
  width:100%;
  background:var(--paper);
  padding:30px 26px 34px;
  box-shadow:0 18px 40px -18px rgba(74,20,38,.45);
  position:relative;
  transform:rotate(-1deg);
  animation:print 1.1s cubic-bezier(.2,.8,.2,1) both;
}
/* torn edges */
.receipt::before,.receipt::after{
  content:"";position:absolute;left:0;right:0;height:12px;
  background:
    linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/16px 12px,
    linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0/16px 12px;
}
.receipt::before{top:-11px;transform:scaleY(-1)}
.receipt::after{bottom:-11px}
@keyframes print{from{transform:translateY(-14px) rotate(-1deg);opacity:.6}to{transform:translateY(0) rotate(-1deg);opacity:1}}

.head{text-align:center;display:flex;flex-direction:column;gap:4px}
.head h1{font-family:var(--f-display);font-weight:400;font-size:2rem;letter-spacing:.01em;margin:0;color:var(--wine);text-wrap:balance}
.head .sub{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.dash{border:0;border-top:2px dashed var(--faint);margin:20px 0;opacity:.7}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--faint);gap:8px;flex-wrap:wrap}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:.95rem}
.items li{display:flex;gap:10px;align-items:baseline}
.items .name{flex:1;min-width:0}
.items .dots{flex:1;border-bottom:1px dotted var(--faint);transform:translateY(-4px);min-width:16px}
.items .amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:1.05rem;gap:12px}
.total .amt{color:var(--wine);text-align:right}
.stamp{
  margin:22px auto 0;width:max-content;max-width:100%;
  border:3px solid var(--wine);color:var(--wine);
  padding:6px 14px;font-weight:700;letter-spacing:.18em;font-size:.9rem;
  transform:rotate(-7deg);opacity:.85;border-radius:6px;text-align:center
}
.note{text-align:center;display:flex;flex-direction:column;gap:6px;padding-inline:8px}
.note .script{font-family:var(--f-script);font-size:3.4rem;line-height:1.05;color:var(--wine);margin:0;text-wrap:balance}
.note p{margin:0;font-family:var(--f-display);font-size:1.25rem;line-height:1.45;text-wrap:balance}
.heart{display:inline-block;color:var(--wine);animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.foot{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.55;text-align:center}
@media (prefers-reduced-motion: reduce){
  .receipt,.heart{animation:none}
}
</style>
</head>
<body>

<canvas id="hearts" aria-hidden="true"></canvas>
<main class="wrap">
  <article class="receipt" aria-label="Dinner bill">
    <header class="head">
      <h1>Dinner ka Bill</h1>
      <span class="sub">Table for two · Delhi</span>
    </header>
    <hr class="dash">
    <div class="meta"><span>Guest: Richa</span><span>Server: Karan</span></div>
    <hr class="dash">
    <ul class="items">
      <li><span class="name">Dinner</span><span class="dots"></span><span class="amt">₹0</span></li>
      <li><span class="name">Your smile</span><span class="dots"></span><span class="amt">Priceless</span></li>
      <li><span class="name">"Kuch bhi" replies</span><span class="dots"></span><span class="amt">Unlimited</span></li>
      <li><span class="name">Being a cutie</span><span class="dots"></span><span class="amt">On the house</span></li>
    </ul>
    <hr class="dash">
    <div class="total"><span>TOTAL DUE</span><span class="amt">1 big hug</span></div>
    <div class="stamp">PAID WITH LOVE</div>
  </article>

  <section class="note">
    <h2 class="script">You're such a cutie</h2>
    <p>and I love you so, so much <span class="heart">♥</span></p>
  </section>

  <div class="foot">No refunds · No returns · Keeping you forever</div>
</main>

<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const c = document.getElementById('hearts'); const ctx = c.getContext('2d');
  let W,H,dpr; const hs=[];
  function size(){dpr=window.devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size(); addEventListener('resize',size);
  function heart(x,y,s,a){
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=a;ctx.fillStyle='#d23a66';
    ctx.beginPath();ctx.moveTo(0,3);ctx.bezierCurveTo(-10,-5,-6,-14,0,-8);ctx.bezierCurveTo(6,-14,10,-5,0,3);ctx.fill();ctx.restore();
  }
  for(let i=0;i<22;i++) hs.push({x:Math.random()*W,y:Math.random()*H,s:.6+Math.random()*1.4,v:.3+Math.random()*.7,a:.15+Math.random()*.35,p:Math.random()*6});
  function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const h of hs){
      if(!reduce){h.y-=h.v; if(h.y<-20){h.y=H+20;h.x=Math.random()*W}}
      heart(h.x+Math.sin(t/900+h.p)*8,h.y,h.s,h.a);
    }
    if(!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
